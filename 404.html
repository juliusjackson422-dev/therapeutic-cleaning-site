<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Therapeutic Cleaning Co.</title>
<meta name="theme-color" content="#F2F1EC">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'><rect width='34' height='34' rx='7' fill='%23F2F1EC'/><path d='M17 27V8.5M17 14.4c-1.9-.7-3.3-2-4.1-3.9M17 18.6c1.9-.7 3.3-2 4.1-3.9' stroke='%231F4034' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F2F1EC; --surface:#FFFFFF; --ink:#14201B; --ink-2:#4F5F57; --line:#DAD9D1;
  --moss:#1F4034; --sage:#7E9A89; --amber:#D9A05B; --amber-hi:#EBB573; --on-amber:#14201B;
  --display:"Newsreader",ui-serif,Georgia,serif;
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1714; --surface:#16231E; --ink:#E9EBE3; --ink-2:#9FB2A8; --line:#27362F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1714; --surface:#16231E; --ink:#E9EBE3; --ink-2:#9FB2A8; --line:#27362F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);
  display:grid;place-items:center;text-align:center;
  padding:48px max(20px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  -webkit-font-smoothing:antialiased
}
.box{max-width:30rem;display:flex;flex-direction:column;align-items:center;gap:20px}
.eyebrow{
  font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);
  display:flex;align-items:center;gap:.7em
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--amber)}
h1{
  margin:0;font-family:var(--display);font-weight:300;letter-spacing:-.02em;
  font-size:clamp(2rem,7vw,3rem);line-height:1.1;text-wrap:balance
}
h1 em{font-style:italic;color:var(--sage)}
p{margin:0;color:var(--ink-2);font-size:1.02rem;line-height:1.6;max-width:36ch}
.row{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:6px}
.btn{
  display:inline-flex;align-items:center;gap:.6em;padding:15px 26px;border-radius:999px;
  background:var(--amber);color:var(--on-amber);text-decoration:none;font-weight:600;font-size:.96rem;
  box-shadow:0 8px 22px rgba(217,160,91,.26);transition:transform .16s,background-color .2s
}
.btn:hover{transform:translateY(-2px);background:var(--amber-hi)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink);background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
  <main class="box">
    <p class="eyebrow">Error 404</p>
    <h1>This page has been <em>tidied away.</em></h1>
    <p>The link was probably old, or there's a typo in it. The home page is still
      exactly where you left it.</p>
    <div class="row">
      <a class="btn" href="/">Back to the home page</a>
      <a class="btn ghost" href="/#contact">Request an estimate</a>
    </div>
  </main>
</body>
</html>
